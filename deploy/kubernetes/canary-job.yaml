apiVersion: batch/v1
kind: Job
metadata:
  name: oj-checker-canary-lab4-cpu
  namespace: csoj-judger
  labels:
    app.kubernetes.io/name: oj-checker
    app.kubernetes.io/component: llm-canary
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 21600
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oj-checker
        app.kubernetes.io/component: llm-canary
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - m601.clusters.zjusct.io
      initContainers:
        - name: fetch-review-basis
          image: harbor.clusters.zjusct.io/library/oj-checker:REQUIRED_AT_DEPLOY_TIME
          command: ["/bin/sh", "-ceu"]
          args:
            - |
              git init /baseline/HPC101
              git -C /baseline/HPC101 remote add origin https://github.com/ZJUSCT/HPC101.git
              git -C /baseline/HPC101 fetch --depth=1 origin c12aaa26a346fd3fd8a39eceb3ac355ba14d19b0
              git -C /baseline/HPC101 checkout --detach FETCH_HEAD
              test "$(git -C /baseline/HPC101 rev-parse HEAD)" = c12aaa26a346fd3fd8a39eceb3ac355ba14d19b0
          env:
            - name: HOME
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: baseline
              mountPath: /baseline
            - name: tmp
              mountPath: /tmp
      containers:
        - name: checker
          image: harbor.clusters.zjusct.io/library/oj-checker:REQUIRED_AT_DEPLOY_TIME
          args:
            - audit
            - --lab
            - lab4-cpu
            - --model
            - gpt-5.6-luna
            - --similarity-threshold
            - "0.7"
            - --similarity-workers
            - "8"
            - --output-root
            - /reports
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: oj-audit-db-ro
                  key: url
            - name: PGOPTIONS
              value: >-
                -c default_transaction_read_only=on
                -c statement_timeout=30000
                -c lock_timeout=1000
                -c idle_in_transaction_session_timeout=30000
                -c application_name=oj-checker-canary
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: oj-audit-llm
                  key: api-key
            - name: LLM_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: oj-audit-llm
                  key: base-url
            - name: OJ_ROOT
              value: /data/.oj
            - name: REPORT_ROOT
              value: /reports
            - name: HPC101_REPOSITORY
              value: /baseline/HPC101
            - name: HPC101_REVISION
              value: c12aaa26a346fd3fd8a39eceb3ac355ba14d19b0
            - name: OJ_CHECKER_GIT_COMMIT
              value: REQUIRED_AT_DEPLOY_TIME
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "4"
              memory: 1Gi
            limits:
              cpu: "8"
              memory: 4Gi
          volumeMounts:
            - name: baseline
              mountPath: /baseline
              readOnly: true
            - name: submissions
              mountPath: /data
              readOnly: true
            - name: reports
              mountPath: /reports
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: baseline
          emptyDir: {}
        - name: submissions
          nfs:
            server: root.clusters.zjusct.io
            path: /tank/hpc101/submissions
            readOnly: true
        - name: reports
          nfs:
            server: root.clusters.zjusct.io
            path: /tank/hpc101/submissions/.oj/audit-reports
        - name: tmp
          emptyDir: {}
