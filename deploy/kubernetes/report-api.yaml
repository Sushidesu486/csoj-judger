apiVersion: v1
kind: PersistentVolume
metadata:
  name: oj-checker-submission-archive
  labels:
    app.kubernetes.io/name: oj-checker
    app.kubernetes.io/component: submission-archive
spec:
  accessModes:
    - ReadOnlyMany
  capacity:
    storage: 4Ti
  csi:
    driver: rook-ceph.cephfs.csi.ceph.com
    fsType: ext4
    nodeStageSecretRef:
      name: rook-csi-cephfs-node
      namespace: rook-ceph
    volumeAttributes:
      clusterID: rook-ceph
      fsName: cephfs
      staticVolume: "true"
      rootPath: /volumes/csi/csi-vol-5e8db87a-2972-4948-a7a4-4abc41b07765/a0667182-0762-4023-ba15-877d9f4d5630
    volumeHandle: oj-checker-submission-archive-20260910
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  volumeMode: Filesystem
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: oj-checker-submission-archive
  namespace: csoj-judger
  labels:
    app.kubernetes.io/name: oj-checker
    app.kubernetes.io/component: submission-archive
spec:
  accessModes:
    - ReadOnlyMany
  resources:
    requests:
      storage: 4Ti
  storageClassName: ""
  volumeMode: Filesystem
  volumeName: oj-checker-submission-archive
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oj-checker-report-api
  namespace: csoj-judger
  labels:
    app.kubernetes.io/name: oj-checker
    app.kubernetes.io/component: report-api
spec:
  replicas: 1
  strategy:
    type: Recreate
    rollingUpdate: null
  selector:
    matchLabels:
      app.kubernetes.io/name: oj-checker
      app.kubernetes.io/component: report-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oj-checker
        app.kubernetes.io/component: report-api
    spec:
      automountServiceAccountToken: false
      restartPolicy: Always
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - m601.clusters.zjusct.io
      initContainers:
        - name: fetch-review-basis
          image: harbor.clusters.zjusct.io/library/oj-checker@sha256:e993a5b77bee511675651a159a75cbf8b55a4f5762eabdce94fa1e9f662d3cdc
          command: ["/bin/sh", "-ceu"]
          args:
            - |
              git init /baseline/HPC101
              git -C /baseline/HPC101 remote remove origin 2>/dev/null || true
              git -C /baseline/HPC101 remote add origin https://github.com/ZJUSCT/HPC101.git
              git -C /baseline/HPC101 fetch --depth=1 origin c12aaa26a346fd3fd8a39eceb3ac355ba14d19b0
              git -C /baseline/HPC101 checkout --detach FETCH_HEAD
              test "$(git -C /baseline/HPC101 rev-parse HEAD)" = c12aaa26a346fd3fd8a39eceb3ac355ba14d19b0
              git init /baseline/NR-amssncku
              git -C /baseline/NR-amssncku remote remove origin 2>/dev/null || true
              git -C /baseline/NR-amssncku remote add origin https://github.com/xiaoqu0000/NR-amssncku.git
              git -C /baseline/NR-amssncku fetch --depth=1 origin 4056a84ccd86dbae57216c0a790b44a8959ebbf5
              test "$(git -C /baseline/NR-amssncku rev-parse FETCH_HEAD)" = 4056a84ccd86dbae57216c0a790b44a8959ebbf5
          env:
            - name: HOME
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: baseline
              mountPath: /baseline
            - name: tmp
              mountPath: /tmp
      containers:
        - name: report-api
          image: harbor.clusters.zjusct.io/library/oj-checker@sha256:e993a5b77bee511675651a159a75cbf8b55a4f5762eabdce94fa1e9f662d3cdc
          args:
            - agent-report-api
            - --listen
            - 0.0.0.0:8080
            - --worker-count
            - "4"
            - --max-queued
            - "1000"
            - --max-run-attempts
            - "3"
            - --reconcile-interval
            - "0"
            - --plagiarism-reconcile-interval
            - "60"
            - --reconcile-batch-size
            - "4"
            - --max-request-threads
            - "32"
            - --public-key-file
            - /etc/oj-checker/review-bundle/public-key
          env:
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: oj-audit-llm
                  key: api-key
            - name: LLM_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: oj-audit-llm
                  key: base-url
            - name: OJ_ROOT
              value: /data/.oj
            - name: OJ_ARCHIVE_ROOT
              value: /archive/oj
            - name: REPORT_ROOT
              value: /reports
            - name: HPC101_REPOSITORY
              value: /baseline/HPC101
            - name: LAB4_REFERENCE_REPOSITORY
              value: /baseline/NR-amssncku
            - name: LAB4_REFERENCE_LABEL
              value: xiaoqu0000/NR-amssncku
            - name: REPORT_API_ALLOWED_MODELS
              value: glm-5.3,gpt-5.6-luna
            - name: REVIEW_BUNDLE_KEY_ID
              value: plat101-review-2026-01
            - name: REPORT_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: oj-checker-report-api
                  key: token
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - name: baseline
              mountPath: /baseline
              readOnly: true
            - name: submissions
              mountPath: /data
              readOnly: true
            - name: submission-archive
              mountPath: /archive
              readOnly: true
            - name: reports
              mountPath: /reports
            - name: tmp
              mountPath: /tmp
            - name: review-bundle-public-key
              mountPath: /etc/oj-checker/review-bundle/public-key
              subPath: public-key
              readOnly: true
      volumes:
        - name: baseline
          emptyDir: {}
        - name: submissions
          nfs:
            server: root.clusters.zjusct.io
            path: /tank/hpc101/submissions
            readOnly: true
        - name: submission-archive
          persistentVolumeClaim:
            claimName: oj-checker-submission-archive
            readOnly: true
        - name: reports
          persistentVolumeClaim:
            claimName: oj-checker-reports-20260825
        - name: tmp
          emptyDir:
            sizeLimit: 8Gi
        - name: review-bundle-public-key
          secret:
            secretName: oj-checker-review-bundle
            items:
              - key: public-key
                path: public-key
---
apiVersion: v1
kind: Service
metadata:
  name: oj-checker-report-api
  namespace: csoj-judger
  labels:
    app.kubernetes.io/name: oj-checker
    app.kubernetes.io/component: report-api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: oj-checker
    app.kubernetes.io/component: report-api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: oj-checker-report-api-ingress
  namespace: csoj-judger
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: oj-checker
      app.kubernetes.io/component: report-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: plat101-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: csoj-judger
          podSelector:
            matchLabels:
              app.kubernetes.io/name: oj-checker
              app.kubernetes.io/component: nightly-review
      ports:
        - protocol: TCP
          port: 8080
